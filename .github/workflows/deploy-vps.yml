name: Build e Deploy VPS (front-management)

# A cada push na main: build da imagem (com o proxy /api/** apontando para o backend
# pela rede interna do Docker) -> GHCR -> SSH na VPS (usuário deploy) -> deploy.sh.
# Rollback: "Run workflow" informando o SHA de um commit anterior (pula o build).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já publicada para reimplantar (SHA). Vazio = build do commit atual."
        required: false

concurrency:
  group: deploy-vps-front-management
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ inputs.tag || github.sha }}
  REMOTE_DIR: /docker/graphicos
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # O proxy do Nitro é compilado no build: o SSR fala com o backend pelo nome
          # do serviço na rede "graphicos" do docker-compose da VPS.
          build-args: NUXT_API_BASE_URL=http://management-api:8080
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configurar SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/id_deploy\n' "${{ secrets.VPS_HOST }}" > ~/.ssh/config

      - name: Deploy
        run: |
          ssh vps "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin >/dev/null \
            && ${{ env.REMOTE_DIR }}/deploy.sh front-management '${{ env.IMAGE_TAG }}'; rc=\$?; docker logout ghcr.io >/dev/null; exit \$rc"
